name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  release:
    types: [published]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Check out moongas-mediascan-python
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediascan-python'
          path: 'moongas-mediascan-python'

      - name: Check out moongas-mediatest-python-pytest
        uses: actions/checkout@v4
        with:
          repository: 'moongas-org/moongas-mediatest-python-pytest'
          path: 'moongas-mediatest-python-pytest'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade Pip
        run: |
          python -m pip install --upgrade pip

      - name: Install Local Python Packages
        run: |
          python -m pip install pandas-stubs
          python -m pip install -e ./moongas-mediascan-python
          python -m pip install -e ./moongas-mediatest-python-pytest
          python -m pip install -e .[dev,llm,stats]

      - name: Run pytest
        run: python -m pytest

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results-py${{ matrix.python-version }}
          path: test-results/pytest.xml

      - name: Lint with ruff
        run: |
          ruff check .

  build:
    name: Build package
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

