[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mediascripts"
version = "1.2.4"
requires-python = ">=3.11"
authors = [{ name = "moongas.org", email = "moongas.org@gmail.com" }]
maintainers = [{ name = "moongas.org", email = "moongas.org@gmail.com" }]
description = "Python scripts for working with Moongas media collections."
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
  "moongas", 
  "mediascan", 
  "music",
  "metadata",
  "database",
  "python",
  "audio",
  "media",
  "tagging",
  "file management",
  "file organization"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  'Intended Audience :: End Users/Desktop',
  'Intended Audience :: Education',
  'Intended Audience :: Science/Research',
  'Topic :: Utilities',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "mediascan >= 1.2.4",
  "mediatest >= 1.2.1",
  "mutagen>=1.47.0",
  "readchar>=4.2.1",
  "requests>=2.32.0",
  "ruamel.yaml>=0.18.6",
  "tqdm>=4.67.0",
]

[project.scripts]
mediascripts = "mediascripts.__main__:main"
acoustid = "mediascripts.acoustid.acoustid:main"
musicbrainz = "mediascripts.acoustid.musicbrainz:main"
spotify = "mediascripts.spotify.spotify:main"
artist-countries-to-mapgraph-json = "mediascripts.artist.artist_mapgraph.artist_countries_to_mapgraph_json:main"
artist-yaml-auto-populate = "mediascripts.artist.artist_yaml.artist_yaml_auto_populate:main"
artist-yaml-reformat = "mediascripts.artist.artist_yaml.artist_yaml_reformat:main"
artist-yaml-test = "mediascripts.artist.artist_yaml.artist_yaml_test:main"
track-yaml-auto-populate = "mediascripts.track.track_yaml.track_yaml_auto_populate:main"
convert-covers = "mediascripts.convert.convert_covers:main"
convert-videos = "mediascripts.convert.convert_videos:main"
compare-track-yaml-with-media-file = "mediascripts.track.track_yaml.compare_track_yaml_with_media_file:main"
merge-track-yaml-with-media-file = "mediascripts.track.track_yaml.merge_track_yaml_with_media_file:main"
copy-medialib = "mediascripts.copy.copy_medialib:main"
generate-dataclasses = "mediascripts.dev.generate_dataclasses:main"
genre-clusters = "mediascripts.stats.genre_clusters:main"
list-albums = "mediascripts.mediascan_db.list_albums:main"
list-artists = "mediascripts.mediascan_db.list_artists:main"
list-mediafiles = "mediascripts.mediascan_db.list_mediafiles:main"
list-tracks = "mediascripts.mediascan_db.list_tracks:main"
list-trackstreaming = "mediascripts.mediascan_db.list_trackstreaming:main"
lyrics-text-auto-populate = "mediascripts.lyrics.lyrics_text.lyrics_text_auto_populate:main"
list-missing-region-names = "mediascripts.artist.artist_mapgraph.list_missing_region_names:main"
make-covers-video = "mediascripts.convert.make_covers_video:main"

rename-album-files = "mediascripts.rename.rename_album_files:main"

[project.optional-dependencies]
essentia = [
  "essentia",
]
dev = [
  "ruff>=0.1.0",
  "pytest>=9.1.1",
  "types-requests>=2.32.0",
]
stats = [
  "matplotlib>=3.10.9 ; python_version < '3.10'",
  "matplotlib>=3.11.1 ; python_version > '3.10'",
  "numpy>=2.2.6 ; python_version < '3.12'",
  "numpy>=2.5.2 ; python_version >= '3.12'",
  "scikit-learn>=1.3.2 ; python_version < '3.12'",
  "scikit-learn>=1.3.2 ; python_version >= '3.12'",
]
llm = [
  "openai>=3.13.0",
  "PyYAML>=6.0.3",
  "tqdm>=4.67.0",
]

[project.urls]
"Homepage" = "https://github.com/moongas-org/moongas-mediasripts-python"
Documentation = "https://github.com/moongas-org/moongas-mediasripts-python"
Repository = "https://github.com/moongas-org/moongas-mediasripts-python.git"
"Bug Tracker" = "https://github.com/moongas-org/moongas-mediasripts-python/issues"
Changelog = "https://github.com/moongas-org/moongas-mediasripts-python/blob/master/CHANGELOG.md"

[tool.setuptools.package-data]
mediascripts = ['py.typed', 'shell/*.sh']

[tool.setuptools.packages.find]
where = ["src"]
include = ["mediascripts*"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
testpaths = [
  "tests"
]
norecursedirs = [
  ".env*",
  ".venv*",
  ".git",
  ".tox",
  "build",
  "dist",
  "env*",
  "venv*",
  "docs",
  "__pycache__",
  "out"
]
addopts = [
  "--ignore=.git",
  "--ignore=.tox",
  "--ignore=build",
  "--ignore=dist",
  "--ignore=__pycache__",
  "--ignore=out"
]

[tool.ruff]
# Set the maximum line length to match your GitHub Actions setup
line-length = 127

[tool.ruff.lint]
# Enable Flake8 syntax/error equivalents (E9, F63, F7, F82)
# "E" and "F" enable pycodestyle errors and Pyflakes
select = ["E9", "F63", "F7", "F82"]

# Enable McCabe complexity checking (equivalent to flake8 --max-complexity=10)
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = "*.pyi"
ignore_errors = true
