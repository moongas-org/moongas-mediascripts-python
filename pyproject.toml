[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mediascripts"
version = "1.2.9"
requires-python = ">=3.11"
authors = [{ name = "moongas.org", email = "moongas.org@gmail.com" }]
maintainers = [{ name = "moongas.org", email = "moongas.org@gmail.com" }]
description = "Python scripts for working with Moongas media collections."
readme = "README.md"
license = { file = "LICENSE" }
keywords = [
  "moongas", 
  "mediascan", 
  "music",
  "metadata",
  "database",
  "python",
  "audio",
  "media",
  "tagging",
  "file management",
  "file organization"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  'Intended Audience :: End Users/Desktop',
  'Intended Audience :: Education',
  'Intended Audience :: Science/Research',
  'Topic :: Utilities',
  'License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)',
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",
]

dependencies = [
  "mediascan >= 1.2.7",
  "mediatest >= 1.2.7",
  "mutagen>=1.47.0",
  "pillow>=10.0.0",
  "readchar>=4.2.1",
  "requests>=2.32.0",
  "ruamel.yaml>=0.18.6",
  "tqdm>=4.67.0",
]

[tool.uv.sources]
mediascan = { git = "https://github.com/moongas-org/moongas-mediascan-python", branch = "main" }
mediatest = { git = "https://github.com/moongas-org/moongas-mediatest-python-pytest", branch = "main" }

[project.scripts]
mediascripts = "mediascripts.console:mediascripts"
acoustid = "mediascripts.console:acoustid"
musicbrainz = "mediascripts.console:musicbrainz"
spotify = "mediascripts.console:spotify"
artist-countries-to-mapgraph-json = "mediascripts.console:artist_countries_to_mapgraph_json"
artist-yaml-auto-populate = "mediascripts.console:artist_yaml_auto_populate"
artist-yaml-reformat = "mediascripts.console:artist_yaml_reformat"
artist-yaml-test = "mediascripts.console:artist_yaml_test"
auto-tag-media-file = "mediascripts.console:auto_tag_media_file"
track-yaml-auto-populate = "mediascripts.console:track_yaml_auto_populate"
track-yaml-auto-create = "mediascripts.console:track_yaml_auto_create"
track-yaml-reformat = "mediascripts.console:track_yaml_reformat"
scan-media-files-to-track-yaml = "mediascripts.console:scan_media_files_to_track_yaml"
convert-covers = "mediascripts.console:convert_covers"
cover-images-auto-download = "mediascripts.console:cover_images_auto_download"
convert-videos = "mediascripts.console:convert_videos"
compare-track-yaml-with-media-file = "mediascripts.console:compare_track_yaml_with_media_file"
merge-track-yaml-with-media-file = "mediascripts.console:merge_track_yaml_with_media_file"
copy-medialib = "mediascripts.console:copy_medialib"
generate-dataclasses = "mediascripts.console:generate_dataclasses"
genre-clusters = "mediascripts.console:genre_clusters"
list-albums = "mediascripts.console:list_albums"
list-artists = "mediascripts.console:list_artists"
list-mediafiles = "mediascripts.console:list_mediafiles"
list-tracks = "mediascripts.console:list_tracks"
list-trackstreaming = "mediascripts.console:list_trackstreaming"
lyrics-text-auto-populate = "mediascripts.console:lyrics_text_auto_populate"
lyrics-text-auto-populate-from-file = "mediascripts.console:lyrics_text_auto_populate_from_file"
lyrics-text-auto-populate-from-lrclib = "mediascripts.console:lyrics_text_auto_populate_from_lrclib"
lyrics-lrc-auto-populate = "mediascripts.console:lyrics_lrc_auto_populate"
list-missing-region-names = "mediascripts.console:list_missing_region_names"
make-covers-video = "mediascripts.console:make_covers_video"
rename-album-files = "mediascripts.console:rename_album_files"
move-from-various-artists = "mediascripts.console:move_from_various_artists"

[project.optional-dependencies]
lyrics = [
  "faster-whisper>=1.2.1",
]
lyrics-align = [
  "whisperx>=3.7.4,<3.8; python_version < '3.14'",
]
essentia = [
  "essentia",
]
dev = [
  "pandas-stubs",
  "ruff>=0.1.0",
  "pytest>=9.1.1",
  "types-requests>=2.32.0",
]
stats = [
  "matplotlib>=3.10.9 ; python_version < '3.10'",
  "matplotlib>=3.11.1 ; python_version > '3.10'",
  "numpy>=2.2.6 ; python_version < '3.12'",
  "numpy>=2.5.2 ; python_version >= '3.12'",
  "scikit-learn>=1.3.2 ; python_version < '3.12'",
  "scikit-learn>=1.3.2 ; python_version >= '3.12'",
]
llm = [
  "openai>=3.13.0",
  "PyYAML>=6.0.3",
  "tqdm>=4.67.0",
]
cover-search = [
  "playwright>=1.51.0",
]

[project.urls]
"Homepage" = "https://github.com/moongas-org/moongas-mediasripts-python"
Documentation = "https://github.com/moongas-org/moongas-mediasripts-python"
Repository = "https://github.com/moongas-org/moongas-mediasripts-python.git"
"Bug Tracker" = "https://github.com/moongas-org/moongas-mediasripts-python/issues"
Changelog = "https://github.com/moongas-org/moongas-mediasripts-python/blob/master/CHANGELOG.md"

[tool.setuptools.package-data]
mediascripts = ['py.typed', 'shell/*.sh', 'shell/*.inc', 'shell/scripts.txt']

[tool.setuptools.packages.find]
where = ["src"]
include = ["mediascripts*"]

[tool.pytest.ini_options]
pythonpath = [
  ".",
  "src"
]
testpaths = [
  "tests"
]
norecursedirs = [
  ".env*",
  ".venv*",
  ".git",
  ".tox",
  "build",
  "dist",
  "env*",
  "venv*",
  "docs",
  "__pycache__",
  "out"
]
addopts = [
  "--ignore=.git",
  "--ignore=.tox",
  "--ignore=build",
  "--ignore=dist",
  "--ignore=__pycache__",
  "--ignore=out"
]

[tool.ruff]
# Set the maximum line length to match your GitHub Actions setup
line-length = 127

[tool.ruff.lint]
# Enable Flake8 syntax/error equivalents (E9, F63, F7, F82)
# "E" and "F" enable pycodestyle errors and Pyflakes
select = ["E9", "F63", "F7", "F82"]

# Enable McCabe complexity checking (equivalent to flake8 --max-complexity=10)
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
mypy_path = "typings"

[[tool.mypy.overrides]]
module = "*.pyi"
ignore_errors = true
